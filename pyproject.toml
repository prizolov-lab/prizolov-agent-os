# pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prizolov-os"
dynamic = ["version"]
description = "Команда ИИ-агентов на Claude для бизнеса: оркестрация, прогнозы рынков, база знаний, Telegram и HTTP API"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Dm.Andreyanov", email = "contact@prizolov.ru" }
]
maintainers = [
    { name = "Dm.Andreyanov", email = "contact@prizolov.ru" }
]
keywords = ["ai", "agents", "rag", "orchestration", "sovereign-ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typing-extensions>=4.0.0",
    "python-dotenv>=1.0.0",
    "anthropic>=1.11.0",
    "rich>=13.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.8.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.16.10",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
telegram = [
    "python-telegram-bot>=21.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
]
mcp = [
    "mcp>=1.2.0",
]
agenomics = [
    "agenomics>=0.9.6",
]
all = [
    "prizolov-os[mcp]",
    "prizolov-os[dev]",
    "prizolov-os[api]",
    "prizolov-os[telegram]",
]

[project.scripts]
prizolov = "cli.main:main"

[project.urls]
Homepage = "https://github.com/prizolov-lab/prizolov-agent-os"
Documentation = "https://github.com/prizolov-lab/prizolov-agent-os/tree/main/docs"
Repository = "https://github.com/prizolov-lab/prizolov-agent-os"
Issues = "https://github.com/prizolov-lab/prizolov-agent-os/issues"
Brand = "https://prizolov.ru"

[tool.setuptools.dynamic]
version = { attr = "prizolov_os.__about__.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["prizolov_os*", "cli*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.setuptools.package-data]
"cli.api" = ["web/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
