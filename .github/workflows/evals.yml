# Проверка агентов на настоящей модели (prizolov eval): раз в неделю и вручную
# (Actions → «Проверка агентов» → Run workflow). Тратит токены: нужен секрет
# ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions). Без секрета
# задача пропускается. Отчёт - в сводке запуска и в артефакте evals-report.

name: Проверка агентов

on:
  schedule:
    - cron: "17 3 * * 1"  # понедельник, 06:17 по Москве
  workflow_dispatch:
    inputs:
      ids:
        description: "Какие проверки запустить через пробел (пусто - все)"
        required: false
        default: ""
      max_usd:
        description: "Лимит расходов, $"
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  evals:
    name: Проверка агентов
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PRIZOLOV_TRACE: "false"
      MPLBACKEND: Agg
    steps:
      - name: Есть ли ключ
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Секрет ANTHROPIC_API_KEY не задан - проверки пропущены." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-python@v7
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Установить пакет
        if: steps.key.outputs.ok == 'true'
        run: pip install -e .
      - name: Проверки
        if: steps.key.outputs.ok == 'true'
        env:
          IDS: ${{ inputs.ids }}
          MAX_USD: ${{ inputs.max_usd || '10' }}
        run: |
          # shellcheck disable=SC2086 - список id разделяется пробелами намеренно
          prizolov eval $IDS --max-usd "$MAX_USD" --out evals-report
      - name: Отчёт в сводку
        if: always() && steps.key.outputs.ok == 'true'
        run: cat evals-report/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always() && steps.key.outputs.ok == 'true'
        with:
          name: evals-report
          path: evals-report/
          if-no-files-found: ignore
